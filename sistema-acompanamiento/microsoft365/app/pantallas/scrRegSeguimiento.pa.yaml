Screens:
  scrRegSeguimiento:
    Properties:
      Fill: =fxC.Fondo
      OnVisible: |-
        =Set(varError, Blank());
        Reset(dpSegFecha);
        Reset(ddSegTipo);
        Reset(ddSegServicio);
        Reset(ddSegModalidad);
        Reset(ddSegMotivo);
        Reset(ddSegPrioridad);
        Reset(ddSegEstado);
        Reset(ddSegAutorizacion);
        Reset(txtSegResumen);
        Reset(txtSegProxima);
        Reset(dpSegProxima)
    Children:
      - rectEncSeg:
          Control: Rectangle
          Properties:
            Fill: =fxC.Acento
            Height: =64
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblEncTituloSeg:
          Control: Label
          Properties:
            Color: =fxC.Blanco
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =64
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =18
            Text: ="Acompañamiento Estudiantil"
            Width: =520
            X: =72
            Y: =0
      - lblEncUsuarioSeg:
          Control: Label
          Properties:
            Align: =Align.Right
            Color: =fxC.Blanco
            Font: =Font.'Segoe UI'
            Height: =64
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: =fxNombreYo & "  ·  " & If(fxEsAdmin, "Administración", If(IsEmpty(fxGestiona), "Personal", Concat(fxGestiona, Corto, ", ")))
            Width: =600
            X: =Parent.Width - 624
            Y: =0
      - icoAtrasSeg:
          Control: Classic/Icon
          Variant: ArrowLeft
          Properties:
            AccessibleLabel: ="Volver"
            Color: =fxC.Blanco
            Height: =40
            Icon: =Icon.ArrowLeft
            OnSelect: =Set(varTab, "seguimiento"); Navigate(scrFicha, ScreenTransition.None)
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Tooltip: ="Volver"
            Width: =40
            X: =16
            Y: =12
      - lblTituloSeg:
          Control: Label
          Properties:
            Color: =fxC.Texto
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =30
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =18
            Text: ="Nuevo registro · " & LookUp(fxUnidades, Codigo = varUnidad).Nombre
            Width: =Parent.Width - 48
            X: =24
            Y: =80
      - lblEstudianteSeg:
          Control: Label
          Properties:
            Color: =fxC.Tenue
            Font: =Font.'Segoe UI'
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: =varEst.'Nombre completo' & "  ·  Código " & varEst.'Código' & If(Not(IsBlank(varEdad)) And varEdad < 18, "  ·  Menor de edad", "")
            Width: =Parent.Width - 48
            X: =24
            Y: =112
      - lblAvisoSeg:
          Control: Label
          Properties:
            Color: =fxC.Reservado
            Font: =Font.'Segoe UI'
            Height: =34
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
