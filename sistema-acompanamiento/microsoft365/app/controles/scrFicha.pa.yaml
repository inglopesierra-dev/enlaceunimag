- conFichaHead:
    Control: GroupContainer
    Variant: manualLayoutContainer
    Properties:
      BorderColor: =fxC.Borde
      BorderThickness: =1
      DropShadow: =DropShadow.None
      Fill: =fxC.Blanco
      Height: =128
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Width: =Parent.Width - 48
      X: =24
      Y: =80
    Children:
      - lblNombre:
          Control: Label
          Properties:
            Color: =fxC.Texto
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =20
            Text: =varEst.'Nombre completo'
            Width: =Parent.Width - 48
            X: =24
            Y: =14
      - lblIdent:
          Control: Label
          Properties:
            Color: =fxC.Tenue
            Font: =Font.'Segoe UI'
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Código " & varEst.'Código' & "  ·  " & varEst.'Tipo de documento' & " " & varEst.Documento & If(IsBlank(varEdad), "", "  ·  " & varEdad & " años")
            Width: =Parent.Width * 0.5
            X: =24
            Y: =48
      - lblMenor:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =fxC.Aviso
            Fill: =fxC.AvisoSuave
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =26
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =11
            Text: |-
              ="Menor de edad: los datos sensibles requieren la autorización de su representante legal"
            Visible: =Not(IsBlank(varEdad)) And varEdad < 18
            Width: =Parent.Width * 0.5 - 24
            X: =Parent.Width * 0.5
            Y: =46
      - htmlChips:
          Control: HtmlViewer
          Properties:
            Height: =40
            HtmlText: |-
              ="<div style='font-family:Segoe UI, sans-serif;font-size:12px'>" &
              Concat(
                  Filter(
                      Table(
                          {t: varEst.Facultad, e: ""},
                          {t: varEst.Programa, e: ""},
                          {t: If(IsBlank(varEst.Periodo), "", "Periodo " & varEst.Periodo), e: ""},
                          {t: If(varEst.Matriculado = "SI", "Matriculado", "No matriculado"), e: If(varEst.Matriculado = "SI", "ok", "aviso")},
                          {t: If(IsBlank(varEst.Promedio), "Sin promedio", "Promedio " & Text(varEst.Promedio, "0.00")), e: ""},
                          {t: If(IsBlank(varEst.Estrato), "", "Estrato " & varEst.Estrato), e: ""},
                          {t: If(varEst.'Cupo especial' = "N/A", "", varEst.'Cupo especial'), e: ""}
                      ),
                      Not(IsBlank(t))
                  ),
                  "<span style='display:inline-block;margin:0 6px 6px 0;padding:3px 10px;border-radius:12px;background:" & Switch(e, "ok", "#E6F3F4", "aviso", "#FFF4E0", "#EEF2F6") & ";color:" & Switch(e, "ok", "#0A6C76", "aviso", "#965500", "#16324F") & "'>" & t & "</span>"
              ) & "</div>"
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =Parent.Width - 48
            X: =24
            Y: =80
